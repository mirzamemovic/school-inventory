# An optional hosted demo with fictional data. Render asks for the two values
# below when this file is first applied. Free services sleep and reset.
services:
  - type: web
    name: school-inventory-demo
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
