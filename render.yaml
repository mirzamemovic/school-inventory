# The one-day video demo only: see VIDEO-DEMO.md. Render asks for the three
# values below when this file is first applied.
services:
  - type: web
    name: school-inventory-demo
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ASSET_NAME
        sync: false
