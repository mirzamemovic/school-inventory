<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # The host ends HTTPS at its own proxy, so PHP only ever sees plain HTTP.
    # Without this, signed links fail: Laravel checks them against the scheme it
    # sees, and they were signed as https.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</VirtualHost>
